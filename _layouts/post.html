---
layout: default
---

<ul class="posts" style="list-style: none; padding: 0;">
  <li class="post-item">
    <h2 class="post-title" style="margin-top: 0;">
      <a href="#" style="color: var(--primary); border: none; pointer-events: none;">{{ page.title }}</a>
    </h2>
    <time class="post-date" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date_to_string }}</time>
  </li>
</ul>

<article class="post" style="margin-top: var(--space-lg);">
  {{ content }}
</article>

{% if site.related_posts != empty %}
  <section class="related">
    <h3>Related posts</h3>
    <ul class="related-posts">
      {% for post in site.related_posts limit:3 %}
        <li>
          <a href="{{ site.baseurl }}{{ post.url }}">{{ post.title }}</a>
          <small>{{ post.date | date_to_string }}</small>
        </li>
      {% endfor %}
    </ul>
  </section>
{% endif %}
