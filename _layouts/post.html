---
layout: default
---

<h2 class="post-title" style="margin: 0 0 0.75rem 0;">{{ page.title }}</h2>
<time class="post-date" datetime="{{ page.date | date_to_xmlschema }}" style="display: block; margin-bottom: var(--space-lg);">{{ page.date | date_to_string }}</time>

<article class="post" style="border-top: 1px solid var(--border); padding-top: var(--space-lg); margin-top: var(--space-lg);">
  {{ content }}
</article>

{% if site.related_posts != empty %}
  <section class="related">
    <h3>Related posts</h3>
    <ul class="related-posts">
      {% for post in site.related_posts limit:3 %}
        <li>
          <a href="{{ site.baseurl }}{{ post.url }}">{{ post.title }}</a>
          <small>{{ post.date | date_to_string }}</small>
        </li>
      {% endfor %}
    </ul>
  </section>
{% endif %}
