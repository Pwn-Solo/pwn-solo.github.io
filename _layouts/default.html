<!DOCTYPE html>
<html lang="en">
  {% include head.html %}
  <body>
    <div class="container">
      <header class="header">
        <h1 class="header-title">
          <a href="{{ site.baseurl }}/">{{ site.title }}</a>
        </h1>
        <nav class="nav">
          {% for nav in site.nav %}
            <a href="{{ nav.url | relative_url }}">{{ nav.title }}</a>
          {% endfor %}
        </nav>
      </header>

      <main class="content">
        {{ content }}
      </main>

      <footer class="footer">
        <p>&copy; {{ site.time | date: '%Y' }}. All rights reserved.</p>
      </footer>
    </div>
  </body>
</html>
